services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - jarvis_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: pulls the models Laraon needs, then exits. Runs every
  # `docker compose up` but is instant (a no-op) once already pulled —
  # this is what makes "clone and run" work without any manual `ollama
  # pull` step on a fresh machine.
  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
      until curl -sf http://ollama:11434/api/tags > /dev/null; do echo waiting for ollama...; sleep 2; done;
      curl -sf http://ollama:11434/api/pull -d '{\"model\":\"qwen2.5:3b\"}' &&
      curl -sf http://ollama:11434/api/pull -d '{\"model\":\"nomic-embed-text\"}'
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Container-safe defaults. These intentionally do not read the host's
      # local .env DATABASE_URL or OLLAMA_BASE_URL values.
      DATABASE_URL: postgresql://jarvis:jarvis@db:5432/jarvis
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      JARVIS_MODE: demo
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-change-me-in-local-env}
    env_file:
      # Optional credentials such as LinkedIn, Meta, Teams, and WhatsApp.
      # Container-critical values above take precedence over this file.
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  jarvis_db_data:
  jarvis_ollama_data:
